<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nanite Forest</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb8cf; font: 13px/1.45 ui-monospace, Consolas, monospace; color: #e8eef2; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; top: 10px; left: 10px; padding: 8px 10px; background: rgba(8, 14, 20, 0.62); border-radius: 6px; white-space: pre; pointer-events: none; min-width: 250px; }
      #help { position: fixed; bottom: 10px; left: 10px; padding: 8px 10px; background: rgba(8, 14, 20, 0.62); border-radius: 6px; white-space: pre; pointer-events: none; }
      #start { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
      #start div { padding: 12px 18px; background: rgba(8, 14, 20, 0.7); border-radius: 8px; font-size: 15px; }
      body.captured #start { display: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #1b2530; font-size: 16px; z-index: 10; }
      #loading.done { display: none; }
      .hidden { display: none !important; }
      body.harness #help, body.harness #start { display: none; }
    </style>
  </head>
  <body>
    <div id="loading"><div id="loadmsg">Generating trees…</div></div>
    <div id="hud"></div>
    <div id="help">WASD move · Space up · Ctrl down · Shift fast · mouse look
L  debug colours (cluster / DAG level / tree)
F  freeze culling     [ ]  error threshold (px)   Q  auto quality
P  shadows   G  wind   H  hide help   Esc  release mouse</div>
    <div id="start"><div>Click to fly</div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
